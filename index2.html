<html lang="en">
<head>

<title>KUB 420/780 · Exam Navigator</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--card:#141e30;--line:#2b3950;--text:#e8effb;--muted:#a0afc6;--mint:#5ce2aa;--blue:#a8ccff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top right,#1b344a,transparent 55%),var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}
a{color:var(--blue)}button,input{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
header{position:sticky;top:0;z-index:2;background:#0d1626;border-bottom:1px solid var(--line)}
.wrap{max-width:1150px;margin:auto;padding-inline:clamp(14px,4vw,34px)}
.brand{display:flex;align-items:baseline;gap:12px;padding-top:14px}.brand strong{font-size:19px}.brand span,.muted,small{color:var(--muted)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 11px;scrollbar-width:thin}
nav a,.pill{white-space:nowrap;text-decoration:none;padding:6px 11px;border:1px solid var(--line);border-radius:7px;color:var(--text);background:#111d30}
nav a[aria-current=page]{border-color:var(--mint);color:var(--mint);background:#16302e}
main{padding-block:27px 55px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(29px,5vw,47px);line-height:1.13;margin-bottom:10px;letter-spacing:-.035em}h2{font-size:21px;margin-bottom:10px}p{margin-bottom:10px}
.kicker{color:var(--mint);font-weight:700;font-size:12px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:8px}
.lead{max-width:72ch;color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:17px 0 22px}.pill{font-size:13px}.pill:hover,nav a:hover{border-color:var(--blue)}
section{margin-top:23px}section,.case{scroll-margin-top:125px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:11px}
article,.reading{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:14px}
.issue h3,.case h3{font-size:16px;line-height:1.32;margin:0 0 6px}
.issue p{margin:0 0 9px}.issue .cite{font-size:14px;color:var(--mint);font-weight:700}.issue .cue{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:5px 13px;font-size:13px}.case-links{border-top:1px solid var(--line);padding-top:8px;margin-top:9px}
.reading{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;margin-top:6px;overflow-wrap:anywhere}.reading input{accent-color:var(--mint);width:17px;height:17px;flex:none}.reading label{cursor:pointer}.reading small{display:block}.reading:has(:checked) label{color:var(--muted)}
.outcomes{display:grid;gap:8px;padding:0;list-style:none}
.outcome{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 15px}
.outcome h3{font-size:16px;margin-bottom:4px}.outcome p{margin-bottom:7px}.outcome p:last-child{margin-bottom:0}
.outcome .links{margin-bottom:7px}.outcome .links b{color:var(--mint)}.outcome .note{color:var(--muted);font-size:14px}
summary{cursor:pointer;color:var(--text);font-weight:700}.directory{margin-left:8px;font-size:13px;font-weight:400}
#case-frame{width:100%;height:calc(100dvh - 112px);min-height:400px;border:0;display:block}#case-frame[hidden]{display:none}
@media(max-width:520px){.brand span{font-size:12px}.grid{grid-template-columns:1fr}}
</style>
</head>

w-tsichlas-and-another-v-touch-line-media-pty-ltd--sa-33641", "textbook": "explained", "status": "partial", "pages": "845–846, 888"}, {"theme": 5, "name": "Smuts v Botha", "url": "https://www3.saflii.org/za/cases/ZASCA/2022/3.html", "textbook": "mentioned", "status": "located", "pages": "901, 909"}, {"theme": 6, "name": "Jafta v Ezemvelo KZN Wildlife", "url": "https://www3.saflii.org/za/cases/ZALC/2008/84.html", "textbook": "explained", "status": "located", "pages": "117"}, {"theme": 6, "name": "FirstRand Bank v Govendor", "url": "https://www.saflii.org/za/cases/ZAGPJHC/2023/610.html", "textbook": "notfound", "status": "located", "pages": ""}, {"theme": 6, "name": "Acrow v South Mead", "url": "https://sheriahub.com/cases/za/caselaw/acrow-limited-v-south-mead-pty-ta-meister-cold-store-in-re-south-mead-pty-ta-meister-cold-store-v-acrow-limited-269612019-2022-zagpphc-802-26-october-2022", "textbook": "notfound", "status": "located", "pages": ""}, {"theme": 6, "name": "Spring Forest v Wilberry", "url": "https://www3.saflii.org/za/cases/ZASCA/2014/178.html", "textbook": "explained", "status": "located", "pages": "124–125, 929–930"}, {"theme": 6, "name": "Global & Local v Fouche", "url": "https://www3.saflii.org/za/cases/ZASCA/2020/8.html", "textbook": "explained", "status": "located", "pages": "124–125, 928–930"}, {"theme": 6, "name": "Borcherds v Duxbury", "url": "https://www3.saflii.org/za/cases/ZAECPEHC/2020/37.html", "textbook": "notfound", "status": "located", "pages": ""}, {"theme": 6, "name": "Standard Bank v SARB", "url": "", "textbook": "notfound", "status": "unverified", "pages": ""}, {"theme": 8, "name": "Parker v Forsyth", "url": "https://lawlibrary.org.za/akn/za-gp/judgment/zagprd/2023/1/eng@2023-06-29", "textbook": "notfound", "status": "located", "pages": ""}, {"theme": 8, "name": "Makunga v Barlequins Beleggings", "url": "https://www3.saflii.org/za/cases/ZAWCHC/2023/332.html", "textbook": "notfound", "status": "located", "pages": ""}, {"theme": 8, "name": "Mavundla v MEC", "url": "https://www.saflii.org/za/cases/ZAKZPHC/2025/2.html", "textbook": "notfound", "status": "located", "pages": ""}, {"theme": 8, "name": "Northbound Processing v SA Diamond Regulator", "url": "https://www.saflii.org/za/cases/ZAGPJHC/2025/661.pdf", "textbook": "notfound", "status": "located", "pages": ""}], "issues": {"1": [["Operating a network or selling a communications service", "An ISP wants to build its own network, or ICASA declines or restricts a licence.", "Electronic Communications Act 36 of 2005, ss 1, 5–6", "Classify the activity as a network service, a communications service or another regulated service. Then check individual licensing, class licensing and exemptions. Altech deals with conversion under the historical transitional framework in s 93.", "eca", ["Altech Autopage Cellular v ICASA"]], ["Data pricing or platform market power", "High mobile data prices, unequal platform access or search rankings that favour the platform’s own services.", "Competition Act 89 of 1998, ss 43A–43B; Electronic Communications Act s 67", "Separate a Competition Commission market inquiry from ICASA’s sector-specific competition powers. Compare the prescribed Data Services and Online Intermediation Platforms market inquiry reports.", "competition", []]], "2": [["Cybersquatting or a disputed .za domain", "Someone registers a domain resembling a business name, offers to sell it, or diverts customers.", "ECTA s 69; .za ADR Regulations regs 3–5", "Check rights in an identical or similar name or mark and whether registration is abusive. Separately check the offensive-registration ground if raised. Compare the evidence of abuse and the registrant’s response.", "adr", ["FIFA v X Yin", "Oceanair Travel v Nu-Com Systems"]], ["Competitor uses your brand as a search keyword", "A sponsored search result appears when a customer types a competitor’s brand.", "Trade Marks Act 194 of 1993, s 34; common-law passing off", "For a registered mark, identify the applicable infringement ground in s 34. For passing off, examine reputation, the alleged misrepresentation and likely confusion in the actual ad and search context.", "tm", ["Cochrane Steel v M-Systems"]]], "3": [["Copied news or online content", "A site republishes a report, excerpt or adapted story.", "Copyright Act 98 of 1978, ss 2, 6, 12, 23–24", "Check originality and subsistence, identify the exclusive act and whether a substantial part was taken, then test any fair-dealing or reporting exception and its conditions.", "copyright", ["Moneyweb v Media24"]], ["Who owns material made by an employee or contractor?", "An employee produces a work for the business or a freelancer develops it under commission.", "Copyright Act ss 1, 21–22", "Separate authorship from first ownership. Check employment, the limited categories covered by the commissioning exception and any assignment or agreement.", "copyright", ["Biotech Laboratories v Beecham"]], ["Copied or reverse-engineered software", "A developer reuses code, adapts a program or claims the same functionality was independently developed.", "Copyright Act ss 2, 11B, 19B, 23", "Identify the protected computer program and the allegedly restricted act. Check the limited exceptions and distinguish copying protected expression from using an idea.", "copyright", ["Accesso v Allforms"]], ["AI-generated work and authorship", "A user claims copyright in output generated with little or no human input.", "Copyright Act ss 1, 2, 21", "Check originality and South Africa’s author definition for computer-generated works, including who undertook the arrangements necessary for creation. Use Thaler as US comparative authority.", "copyright", ["Thaler v Perlmutter"]]], "4": [["Collecting or reusing personal information", "An employer, website or company collects information or uses it for a different purpose.", "POPIA ss 3–4, 8–18", "Check scope, identify the responsible party, establish a lawful basis, and test minimality, purpose, retention, further processing and notification as the facts require.", "popia", ["Sheburi v Rail Safety Regulator"]], ["Unauthorised access or a data leak", "A staff member opens records without permission or a vendor exposes a database.", "POPIA ss 19–22", "Separate safeguards, operator duties and notification. For s 22, look for reasonable grounds to believe an unauthorised person accessed or acquired personal information.", "popia", []], ["Monitoring or intercepting communications", "A person records a call or an employer monitors workplace messages.", "RICA ss 2, 4–6", "Start with the general prohibition and check which exception the facts might satisfy: party to the communication, prior written consent of a party, or qualifying business interception. Check each exception’s conditions.", "rica", []], ["Surveillance used as evidence", "An investigator films someone in public and a litigant wants to use the footage in court.", "POPIA ss 11, 27(1)(b)", "Test lawful processing and, where special personal information is involved, the legal-right exception. Consider the purpose, less intrusive means and redaction.", "popia", ["De Jager v Netcare"]], ["Sensitive data, children or overseas transfers", "The facts involve health information, children’s records or an overseas processor.", "POPIA ss 26–35, 72", "Identify the category and applicable authorisation. If data is transferred abroad, check the available grounds under s 72 separately.", "popia", []], ["Marketing emails or SMS", "A business contacts a prospect, requests consent again or markets to an existing customer.", "POPIA s 69", "Distinguish consent from the existing-customer exception. Check the once-only consent approach and the opportunity to object at collection and on each qualifying customer communication.", "popia", []]], "5": [["Defamation, privacy or a takedown", "A damaging Facebook post, a repost, a forum comment or disclosure of personal details.", "Common law; Constitution ss 10, 14, 16", "Identify the claim first. For defamation, examine publication, reference and defamatory meaning, then wrongfulness, fault and any defence. For privacy, assess the nature of the information and any justification for disclosure.", "constitution", ["Isparta v Richter", "Heroldt v Wills", "Tsichlas v Touch Line Media", "Smuts v Botha"]], ["Hate speech targeting a protected group", "A post attacks someone on a prohibited ground and may incite harm or promote hatred.", "Equality Act (PEPUDA) s 10; Constitution s 16(2)", "Apply the statutory threshold, including the prohibited ground and the harm and hatred requirements. Keep the constitutional exclusion and the statutory civil claim distinct.", "equality", []], ["Threats or intimate images shared electronically", "Someone sends a threat, encourages violence or forwards another person’s intimate image without consent.", "Cybercrimes Act 19 of 2020, ss 14–16", "Match the conduct to the provision: incitement under s 14, threats under s 15, or unlawful and intentional disclosure of an intimate image under s 16. Check the specific elements.", "cyber", []], ["Distribution of private sexual images", "A private sexual photograph or film is distributed, including via social media.", "Films and Publications Act 65 of 1996, s 18F; Cybercrimes Act s 16", "Check the statutory elements separately for each provision, including consent, the type of image and intention to cause harm under s 18F. Start with the prescribed readings on revenge pornography.", "films", []], ["Child sexual abuse material", "The facts involve possession, production, access or distribution of sexual material involving children.", "Films and Publications Act s 24B", "Identify the specific conduct, the statutory definition and any reporting duty raised by the facts.", "films24", []], ["Platform hosting or a take-down notice", "A site hosts another person’s post and receives a complaint asking for removal.", "ECTA ss 72, 75, 77", "Distinguish the claim against the author from any hosting protection. Check eligibility, knowledge and whether the notice meets the statutory requirements.", "ecta", ["Tsichlas v Touch Line Media"]]], "6": [["Did a contract form by email, SMS or click?", "An offer is accepted electronically or standard terms are linked during checkout.", "ECTA ss 1, 11–12, 22–24", "Check validity of electronic form and incorporation of linked terms. Test common-law agreement, then locate receipt of acceptance for time and place of formation.", "ecta", ["Jafta v Ezemvelo KZN Wildlife"]], ["Did the email legally arrive?", "A sender alleges a message was sent, while the recipient denies receiving it.", "ECTA ss 23, 26", "Separate evidence of dispatch from the statutory test for receipt. Check the designated or used system, retrievability and whether acknowledgement was expressly made a condition.", "ecta", ["Acrow v South Mead"]], ["Did a typed name or digital signature count?", "The document contains a typed name, scanned signature or DocuSign signature. It may involve land or an instruction under a mandate.", "ECTA ss 4, 13 and Schedule 2; Alienation of Land Act s 2(1) where relevant", "Check the exclusions before applying ECTA. Identify whether law or the parties require the signature, then apply the appropriate test and read the wording of any mandate.", "ecta", ["Spring Forest v Wilberry", "Global & Local v Fouche", "Borcherds v Duxbury", "FirstRand Bank v Govendor"]], ["Automated checkout or a disputed digital record", "An electronic agent places an order, a customer makes an input error, or authenticity is disputed.", "ECTA ss 14–15, 20, 25", "Check the electronic-agent rules and any input-error exception. For evidence, separate integrity, attribution, admissibility and evidential weight.", "ecta", []], ["Online purchase, refund or late delivery", "An online supplier omits information, refuses cancellation or fails to deliver.", "ECTA ss 42–44, 46–49", "Check which protections and exclusions apply before analysing disclosure, cooling-off or performance. Section 45 was repealed.", "ecta", []], ["Unsolicited direct marketing", "A marketer sends a second consent request or relies on an existing sale.", "POPIA s 69; CPA s 11 and prescribed reg 4", "Apply POPIA to unsolicited electronic marketing, then consider the CPA restriction and applicable blocking rules. For the customer exception, check collection in the context of a sale, similar offerings and opportunities to object.", "popia", []], ["Crypto assets or exchange control", "A crypto asset is marketed as a financial product or transferred across borders.", "FAIS Act; FSCA General Notice 1350 of 2022; Exchange Control Regulations", "Identify whether the issue is financial services regulation or exchange control. For exchange control, read the applicable regulation and check the procedural history of the prescribed judgment.", "fsca", ["Standard Bank v SARB"]]], "8": [["Fabricated cases or citations in court", "A practitioner files AI-generated authorities that cannot be traced.", "Legal Practice Act 28 of 2014, s 36; LPC Code of Conduct", "Use the Code for professional duties and the judgments for how courts assess verification failures, costs or referral. Section 36 provides the basis for the Code.", "lpc", ["Parker v Forsyth", "Mavundla v MEC", "Northbound Processing v SA Diamond Regulator"]], ["AI assists a self-represented litigant", "A litigant uses a chatbot to prepare submissions.", "Case law and court procedure", "Start with Makunga as an example of AI-assisted submissions. For a problem involving fabricated citations or practitioner duties, compare the cases in the preceding issue.", "", ["Makunga v Barlequins Beleggings"]], ["Automated profiling, risk scoring or insurance", "An automated system sets insurance terms, ranks applicants or rejects a person.", "POPIA ss 11, 19, 71", "Ask whether the decision is based solely on automated processing intended to profile the person and has legal or substantial effects. Check the statutory exceptions and safeguards. Use the insurance readings for sector context.", "popia", []]]}, "sources": {"ecta": ["ECTA", "https://lawlibrary.org.za/akn/za/act/2002/25/eng@2021-12-01"], "popia": ["POPIA", "https://lawlibrary.org.za/akn/za/act/2013/4"], "rica": ["RICA", "https://www.gov.za/documents/regulation-interception-communications-and-provision-communication-related-information-act"], "cpa": ["CPA", "https://lawlibrary.org.za/akn/za/act/2008/68"], "cyber": ["Cybercrimes Act", "https://lawlibrary.org.za/akn/za/act/2020/19"], "copyright": ["Copyright Act", "https://lawlibrary.org.za/akn/za/act/1978/98"], "tm": ["Trade Marks Act", "https://lawlibrary.org.za/akn/za/act/1993/194"], "competition": ["Competition Act", "https://lawlibrary.org.za/akn/za/act/1998/89"], "haupt": ["Haupt v Brewers Marketing Intelligence (supporting judgment)", "https://www.saflii.org/za/cases/ZASCA/2006/40.html"], "whelan": ["Whelan v Jaslow (US comparative judgment)", "https://law.justia.com/cases/federal/appellate-courts/F2/797/1222/104748/"], "sony": ["Sony v Universal City Studios (US comparative judgment)", "https://www.law.cornell.edu/supremecourt/text/464/417"], "paia": ["Promotion of Access to Information Act", "https://www.gov.za/documents/promotion-access-information-act"], "udrp": ["ICANN Uniform Domain Name Dispute Resolution Policy", "https://www.icann.org/resources/pages/policy-2024-02-21-en/"], "wct": ["WIPO Copyright Treaty", "https://www.wipo.int/edocs/mdocs/diplconf/en/crnr_dc/crnr_dc_94.html"], "nps": ["National Payment System Act", "https://www.gov.za/documents/national-payment-system-act"], "fais": ["Financial Advisory and Intermediary Services Act", "https://www.gov.za/documents/financial-advisory-and-intermediary-services-act"], "lpa": ["Legal Practice Act", "https://lawlibrary.org.za/akn/za/act/2014/28/eng@2018-01-18"], "films24": ["Films and Publications Act s 24B", "https://www.acts.co.za/films-and-publications-act-1996/24b__offences_and_penalties_in_respect"], "qwelane": ["Qwelane (supporting judgment)", "https://www3.saflii.org/za/cases/ZACC/2021/22.html"], "adr3": ["ADR regulation 3", "https://www.acts.co.za/ELECTRONIC-COMMUNICATIONS-AND-TRANSACTIONS-ACT-2002/r1166_3__dispute_resolution_se"], "eca": ["Electronic Communications Act", "https://www.saflii.org/za/legis/consol_act/eca2005270.pdf"], "adr": [".za ADR regulations and amendment", "https://www.gov.za/sites/default/files/gcis_document/201711/41237gon1246.pdf"], "constitution": ["Constitution", "https://www.justice.gov.za/legislation/constitution/saconstitution-web-eng.pdf"], "equality": ["Equality Act s 10", "https://www.acts.co.za/promotion-of-equa/10_prohibition_of_hate_speech"], "films": ["Films and Publications Amendment Act", "https://www.gov.za/sites/default/files/gcis_document/201910/42743gon1292.pdf"], "fsca": ["FSCA declaration", "https://www.gov.za/sites/default/files/gcis_document/202210/47334gen1350.pdf"], "lpc": ["LPC Code of Conduct", "https://lpc.org.za/legal-practitioners/code-of-conduct/"], "cpareg": ["Prescribed CPA regulation 4", "https://www.acts.co.za/consumer-protection/r293_4__mechanisms_to_block_direct_marketing_communication"]}, "outcomes": {"1": {"section": "8.3", "pages": "13–14", "entries": [{"title": "Internet development and convergence", "description": "Explain how the internet developed and how it enabled convergence across communications and media.", "provisions": [], "cases": [], "supportingCases": [], "note": "Start with the prescribed textbook reading (a)."}, {"title": "South African telecommunications law", "description": "Trace the historical development of telecommunications law in South Africa.", "provisions": [["eca", "Electronic Communications Act (ECA), including historical s 93"]], "cases": [0], "supportingCases": [], "note": "Use Altech to illustrate licence conversion and the transition to the ECA framework."}, {"title": "South African ICT legislation", "description": "Explain the role and scope of the main laws governing ICT in South Africa.", "provisions": [["eca", "ECA ss 1–2, 5–6"], ["ecta", "ECTA ss 1–4"], ["paia", "PAIA ss 11, 50"], ["rica", "RICA ss 2–6"]], "cases": [], "supportingCases": [], "note": "Distinguish network and service regulation, electronic transactions, access to records and interception."}, {"title": "ECTA definitions", "description": "Use s 1 to define data message, information system, internet, IP address and World Wide Web.", "provisions": [["ecta", "ECTA s 1"]], "cases": [14], "supportingCases": [], "note": "Jafta illustrates how the data-message definition applies to SMS and email."}, {"title": "Internet access as a basic right", "description": "Assess whether internet access should be recognised as a basic right, using infrastructure rights and other jurisdictions as comparisons.", "provisions": [["constitution", "Constitution ss 16, 26–27, 32"], ["eca", "ECA s 2"]], "cases": [], "supportingCases": [], "note": "Use the constitutional provisions as comparative and analytical starting points."}, {"title": "ICT policy and the digital economy", "description": "Evaluate how policy, legislation, market dominance and anti-competitive conduct affect the digital economy.", "provisions": [["eca", "ECA ss 2, 67"], ["competition", "Competition Act ss 8, 43A–43B"]], "cases": [0], "supportingCases": [], "note": "Use the prescribed market inquiry reports (c) and (d) for evidence about prices, access and competition."}, {"title": "Current ICT regulatory issues", "description": "Explain interconnection, facilities leasing, call termination rates, spectrum licensing, digital migration and low Earth orbit satellite services.", "provisions": [["eca", "ECA ss 5–6, 31, 37, 43, 67"]], "cases": [0], "supportingCases": [], "note": "Separate service licensing, spectrum licensing and competition measures. Altech illustrates historical licence conversion."}, {"title": "Online platform market inquiry", "description": "Explain the role of intermediaries and assess the inquiry’s implications for competition, market dominance and consumer protection.", "provisions": [["competition", "Competition Act ss 43A–43B"]], "cases": [], "supportingCases": [], "note": "Use the prescribed Online Intermediation Platforms Market Inquiry final report (d)."}]}, "2": {"section": "9.3", "pages": "17–18", "entries": [{"title": "DNS organisation and administration", "description": "Explain how the domain name system is organised, regulated and administered.", "provisions": [["ecta", "ECTA Chapter X (.za domain name authority)"]], "cases": [], "supportingCases": [], "note": "Use textbook reading (a) for the DNS hierarchy and international governance."}, {"title": "DNS terminology", "description": "Use IP address, DNS, TLD, gTLD, ccTLD, NSI, IANA, ICANN, Verisign GRS, AFRINIC, WHOIS and UDRP to explain how the DNS works.", "provisions": [["udrp", "ICANN UDRP, para 4 (dispute policy)"]], "cases": [], "supportingCases": [], "note": "Use textbook reading (a) for the technical and institutional terms."}, {"title": "Trade marks and domain names", "description": "Explain why trade mark rights can conflict with domain registration and use.", "provisions": [["tm", "Trade Marks Act s 34"], ["adr3", ".za ADR Regulations reg 3"]], "cases": [1, 2], "supportingCases": [], "note": "Separate registered-mark infringement from a .za registration dispute."}, {"title": "Cybersquatting, typosquatting and metatags", "description": "Analyse how these practices can affect trade mark rights and domain disputes.", "provisions": [["tm", "Trade Marks Act s 34"], ["adr3", ".za ADR Regulations reg 3"], ["udrp", "ICANN UDRP para 4"]], "cases": [1, 3], "supportingCases": [], "note": "Cochrane concerns paid search keywords and passing off. Use it for comparison when discussing search-related conduct."}, {"title": "Domain registration and dispute procedure", "description": "Describe how a domain is registered and the steps used to resolve a typical dispute.", "provisions": [["ecta", "ECTA Chapter X and s 69"], ["adr3", ".za ADR Regulations reg 3"], ["udrp", "ICANN UDRP para 4"]], "cases": [1, 2], "supportingCases": [], "note": "Check the applicable registry rules and dispute procedure for the domain in the question."}, {"title": "South African domain dispute resolution", "description": "Explain how to register a domain and use the South African dispute mechanism.", "provisions": [["ecta", "ECTA s 69"], ["adr3", ".za ADR Regulations reg 3"], ["adr", ".za ADR amendments, including regs 4–5"]], "cases": [1, 2], "supportingCases": [], "note": "Use the regulations in force at the relevant time when comparing older decisions."}, {"title": "Common domain and trade mark disputes", "description": "Identify competing legitimate claims, infringement, dilution, tarnishment, squatting, metatags, AdWords, reverse hijacking, protest sites and technojacking.", "provisions": [["tm", "Trade Marks Act s 34"], ["adr3", ".za ADR Regulations reg 3"], ["adr", ".za ADR amendments, including regs 4–5"], ["udrp", "ICANN UDRP para 4"]], "cases": [1, 2, 3], "supportingCases": [], "note": "Choose the appropriate route for the conduct. Use prescribed reading (b) for tarnishment and protest sites."}, {"title": "Problem-solving", "description": "Apply trade mark and domain dispute rules to a fact pattern and propose a remedy.", "provisions": [["tm", "Trade Marks Act s 34"], ["adr3", ".za ADR Regulations reg 3"], ["udrp", "ICANN UDRP para 4"]], "cases": [1, 2, 3], "supportingCases": [], "note": "Classify the domain and the conduct before choosing a test and remedy."}]}, "3": {"section": "10.3", "pages": "20–21", "entries": [{"title": "Software copyright tests", "description": "Compare the Whelan, three-pronged and abstraction–filtration–comparison approaches to protected elements of computer programs.", "provisions": [["copyright", "Copyright Act ss 2, 11B, 23 (South African starting point)"]], "cases": [], "supportingCases": ["whelan"], "note": "Use textbook reading (a) for the comparative rmation requirements and distinguish the agreement from the code used to perform it."}, {"title": "Marketplaces and platforms", "description": "Assess platform and seller obligations, including counterfeit goods, unauthorised sales and liability.", "provisions": [["ecta", "ECTA ss 42–43, 72–78"], ["cpa", "CPA s 5"], ["tm", "Trade Marks Act s 34"]], "cases": [], "supportingCases": [], "note": "Identify who acts as supplier and what the platform actually does before applying a liability rule."}, {"title": "Unsolicited communications and direct marketing", "description": "Explain the rules for unsolicited electronic marketing and consumer blocking rights.", "provisions": [["popia", "POPIA s 69"], ["cpa", "CPA s 11"], ["cpareg", "Prescribed CPA reg 4"]], "cases": [], "supportingCases": [], "note": "Distinguish consent from the existing-customer exception. The ECTA consolidation marks s 45 as repealed."}]}, "8": {"section": "15.3", "pages": "34–35", "entries": [{"title": "AI and algorithmic decisions", "description": "Identify legal and ethical risks when AI systems make or influence decisions.", "provisions": [["popia", "POPIA ss 11, 19, 71"], ["constitution", "Constitution ss 9, 14"]], "cases": [], "supportingCases": [], "note": "For s 71, check solely automated profiling and whether the decision has legal or substantial effects."}, {"title": "Robo-advisers and legal services", "description": "Assess how robo-advisers can change legal services and the responsibilities of practitioners.", "provisions": [["lpa", "Legal Practice Act s 36"], ["lpc", "LPC Code of Conduct"], ["fais", "FAIS Act where financial advice is involved"]], "cases": [22, 21], "supportingCases": [], "note": "Use the cases for legal assistance and verification, and Huneberg reading (h) for the insurance context."}, {"title": "Emerging technologies in law", "description": "Assess legal uses and regulatory questions for blockchain, virtual reality and natural language processing.", "provisions": [["ecta", "ECTA ss 11, 20, 22 where relevant to transactions"], ["popia", "POPIA ss 3, 11, 19 where personal data is processed"]], "cases": [22, 24], "supportingCases": [], "note": "The cases concern AI-assisted submissions or research. Choose the governing rules for the specific use described."}, {"title": "Internet of Things", "description": "Explain how connected devices work together and assess their legal implications.", "provisions": [["popia", "POPIA ss 11, 18–22, 72"], ["rica", "RICA ss 2–6 where interception is at issue"]], "cases": [], "supportingCases": [], "note": "Focus on collection, security, vendor roles and transfer of device data."}, {"title": "Bias, transparency and accountability", "description": "Evaluate ethical issues in legal AI and identify who is responsible for its use.", "provisions": [["constitution", "Constitution ss 9, 34"], ["popia", "POPIA s 71"], ["lpa", "Legal Practice Act s 36"], ["lpc", "LPC Code of Conduct"]], "cases": [21, 23, 24], "supportingCases": [], "note": "Use these cases for citation verification and practitioner accountability."}, {"title": "Regulatory frameworks and reform", "description": "Assess how existing rules apply to AI and emerging technology and propose improvements.", "provisions": [["popia", "POPIA s 71"], ["lpa", "Legal Practice Act s 36"], ["lpc", "LPC Code of Conduct"], ["copyright", "Copyright Act ss 1–2, 21"]], "cases": [23, 24, 7], "supportingCases": [], "note": "Identify the specific gap before proposing reform. Thaler provides US comparative context."}, {"title": "Predictive analytics and sentencing", "description": "Assess possible uses of AI to predict case outcomes or inform sentencing and identify safeguards.", "provisions": [["constitution", "Constitution ss 9, 34, 35(3)"], ["popia", "POPIA s 71 where its requirements are met"]], "cases": [], "supportingCases": [], "note": "Use Gravett reading (a) for critical analysis of predictive tools and their limits."}, {"title": "AI in the courts and human rights", "description": "Assess AI’s impact on judicial decision-making and rights such as fair process and equality.", "provisions": [["constitution", "Constitution ss 9, 34, 35(3)"], ["lpa", "Legal Practice Act s 36"], ["lpc", "LPC Code of Conduct"]], "cases": [21, 22, 23, 24], "supportingCases": [], "note": "The cases illustrate AI use in submissions and verification. Use constitutional safeguards to analyse AI used by a court."}, {"title": "Access to justice and intellectual property", "description": "Evaluate how emerging technology affects access to justice, copyright and related legal rights.", "provisions": [["constitution", "Constitution s 34"], ["copyright", "Copyright Act ss 1–2, 21, 23"]], "cases": [22, 7], "supportingCases": [], "note": "Compare AI assistance to litigants with the separate question of authorship and protection for AI output."}]}}}</script>
<script>
const data = JSON.parse(document.getElementById('dataset').textContent);
const tabs = document.getElementById('tabs');
const view = document.getElementById('theme-view');
const frame = document.getElementById('case-frame');
const progressKey = 'kub780-reading-progress-v2';
let reviewed = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(progressKey) || '[]');
  if (Array.isArray(saved)) reviewed = new Set(saved);
} catch {}
const escape = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const external = (url, label) => /^https:\/\//i.test(url || '')
  ? `<a href="${escape(url)}" target="_blank" rel="noopener noreferrer">${escape(label)} ↗</a>` : '';
const source = id => data.sources[id] ? external(data.sources[id][1], data.sources[id][0]) : '';
const themes = Object.keys(data.labels);
const shortLabels = ['Telecoms','Domains','Copyright','Privacy','Content','E-contracting','AI'];
const readingNotes = {
  't5-b': 'The official citation is Act 19 of 2020.',
  't8-f': 'The supplied reading cites [2025] ZAGPJHC 538. The case link opens [2025] ZAGPJHC 661, which discusses the AI-generated authorities.'
};
let active = '';

tabs.innerHTML = `<a href="#cases" data-tab="cases">Case Law</a>` + themes.map((theme, index) =>
  `<a href="#theme-${theme}" data-tab="theme-${theme}" title="${escape(data.labels[theme])}">Theme ${theme} · ${shortLabels[index]}</a>`).join('');

function caseLink(name, theme) {
  return `<a href="#theme-${theme}/case-${data.cases.findIndex(item => item.name === name && item.theme === Number(theme))}">${escape(name)}</a>`;
}

function learningOutcomes(theme) {
  const {section, pages, entries} = data.outcomes[theme];
  const cards = entries.map((outcome, index) => {
    const provisions = outcome.provisions.map(([id, label]) => external(data.sources[id][1], label));
    const cases = outcome.cases.map(id => {
      const item = data.cases[id];
      const context = item.theme === Number(theme) ? '' : ` <small>(Theme ${item.theme})</small>`;
      return `<span>${caseLink(item.name, item.theme)}${context}</span>`;
    });
    cases.push(...outcome.supportingCases.map(source));
    const letter = theme === '3' && index === 9 ? '' : `${String.fromCharCode(97 + index)}) `;
    return `<li class="outcome"><h3>${letter}${escape(outcome.title)}</h3>
      <p>${escape(outcome.description)}</p>
      ${provisions.length ? `<div class="links"><b>Acts &amp; other sources</b>${provisions.join('')}</div>` : ''}
      ${cases.length ? `<div class="links"><b>Cases</b>${cases.join('')}</div>` : ''}
      <p class="note">${escape(outcome.note)}</p></li>`;
  }).join('');
  return `<section id="learning-outcomes"><h2>Learning outcomes</h2>
    <p class="muted">Study guide § ${section} · pp. ${pages}. Outcomes are paraphrased in guide order. The authorities are study pointers and include supporting sources where relevant.</p>
    <ol class="outcomes">${cards}</ol></section>`;
}

function themePage(theme) {
  const cases = data.cases.filter(item => item.theme === Number(theme));
  const readings = data.readings.filter(item => item.theme === Number(theme));
  const issueCards = data.issues[theme].map(([title, cue, ref, use, primary, names], index) => {
    const additional = {
      '1-1':['eca'], '2-0':['ecta','adr3'], '5-1':['constitution','qwelane'], '5-3':['cyber'],
      '6-5':['cpa','cpareg']
    }[`${theme}-${index}`] || [];
    return `<article class="issue"><h3>${escape(title)}</h3><p class="cue">${escape(cue)}</p>
      <p class="cite">${escape(ref)}</p><p>${escape(use)}</p>
      <div class="links">${[primary, ...additional].map(source).join('')}</div>
      ${names.length ? `<div class="links case-links">${names.map(name => caseLink(name, theme)).join('')}</div>` : ''}</article>`;
  }).join('');
  const caseCards = cases.map(item => `<article class="case" id="case-${data.cases.indexOf(item)}">
    <h3>${escape(item.name)}</h3><small>${item.pages ? 'Textbook PDF pp. ' + escape(item.pages) : 'See the reading list or Case Law dashboard'}</small>
    <div class="links">${external(item.url, item.status === 'partial' ? 'Available source' : 'Open judgment') || '<small>See the prescribed reading for this case.</small>'}</div></article>`).join('');
  const readingRows = readings.map(item => `<div class="reading">
    <input type="checkbox" id="${escape(item.id)}" data-reading="${escape(item.id)}" ${reviewed.has(item.id) ? 'checked' : ''}>
    <div><label for="${escape(item.id)}">${escape(item.title)}</label>
      <small>${escape(item.type)} · Study guide p. ${escape(item.page)} · Reading ${escape(item.letter)} ${external(item.url, 'Open source')}</small>${readingNotes[item.id] ? `<small>${escape(readingNotes[item.id])}</small>` : ''}</div></div>`).join('');
  view.innerHTML = `<div class="kicker">Theme ${theme} · Study guide p. ${data.pages[theme]}</div>
    <h1>${escape(data.labels[theme])}</h1>
    <p class="lead">Match the facts to an issue below, open the relevant provision for the Rule step of IRAC, then use the linked cases to compare how the rule applies.</p>
    <div class="jump"><a class="pill" href="#theme-${theme}/issues">Issues &amp; legislation</a><a class="pill" href="#theme-${theme}/theme-cases">Cases</a><a class="pill" href="#theme-${theme}/readings">Prescribed readings</a><a class="pill" href="#theme-${theme}/learning-outcomes">Learning outcomes</a></div>
    <section id="issues"><h2>Issues &amp; legislation</h2><p class="muted">Check the wording and version of the provision that applies to the facts. The issue cards also include supporting authorities where relevant.</p><div class="grid">${issueCards}</div></section>
    <section id="theme-cases"><h2>Cases in this theme <a class="directory" href="#cases">Full Case Law dashboard ↗</a></h2><div class="grid">${caseCards}</div></section>
    <section id="readings"><h2>Prescribed readings</h2><p class="muted">Reading list from the supplied hub. Checkboxes are saved in this browser when browser storage is available.</p>${readingRows}</section>${learningOutcomes(theme)}`;
}

function route() {
  const [requested, anchor] = location.hash.slice(1).split('/');
  const theme = requested.startsWith('theme-') ? requested.slice(6) : '';
  const tab = themes.includes(theme) ? requested : 'cases';
  if (active !== tab) {
    active = tab;
    const showCases = tab === 'cases';
    frame.hidden = !showCases;
    view.hidden = showCases;
    document.title = 'KUB 420/780 · ' + (showCases ? 'Case Law' : data.labels[theme]);
    tabs.querySelectorAll('[data-tab]').forEach(link => {
      if (link.dataset.tab === tab) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
    if (!showCases) themePage(theme);
    window.scrollTo(0, 0);
  }
  if (anchor && tab !== 'cases') {
    const target = document.getElementById(anchor);
    if (target && view.contains(target)) {
      target.tabIndex = -1;
      target.focus({preventScroll:true});
      target.scrollIntoView();
    }
  } else if (tab !== 'cases') {
    window.scrollTo(0, 0);
  }
}

view.addEventListener('change', event => {
  const id = event.target.dataset.reading;
  if (!id) return;
  if (event.target.checked) reviewed.add(id);
  else reviewed.delete(id);
  try { localStorage.setItem(progressKey, JSON.stringify([...reviewed])); } catch {}
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
